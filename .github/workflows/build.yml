name: Build Project

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build All Platforms
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true # In case some assets are stored in LFS

      - name: Set up JDK for Android jarsigner
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download and prepare Godot
        env:
          GODOT_VERSION: 4.4.1
          GODOT_VERSION_STRING: 4.4.1.stable
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends wget unzip
          
          # Download Godot headless executable
          wget "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip godot.zip
          rm godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          ./godot --version # Print version for logs

          # Download and install export templates
          wget "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION_STRING}
          unzip templates.tpz -d ~/.local/share/godot/export_templates/${GODOT_VERSION_STRING}
          rm templates.tpz
          mv ~/.local/share/godot/export_templates/${GODOT_VERSION_STRING}/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION_STRING}/
          rmdir ~/.local/share/godot/export_templates/${GODOT_VERSION_STRING}/templates

      - name: Create Android debug keystore
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          # The export preset is configured to sign, and Godot will automatically
          # use this debug keystore if it exists at the default location.

      - name: Create Export Directories
        run: mkdir -p web exports exports/test

      - name: Export Windows
        continue-on-error: true
        run: ./godot -v --headless --export-release "Windows Desktop"

      - name: Upload Windows Build
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: exports/MCU-Sim.exe

      - name: Export Linux
        continue-on-error: true
        run: ./godot -v --headless --export-release "Linux"

      - name: Upload Linux Build
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: exports/test/MCU-Sim.x86_64

      - name: Export Android
        continue-on-error: true
        run: ./godot -v --headless --export-debug "Android"

      - name: Upload Android Build
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: exports/MCU-Sim.apk

      - name: Export Web
        continue-on-error: true
        run: ./godot -v --headless --export-release "Web"

      - name: Upload Web Build
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-web
          path: web/

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-web
          path: ./dist

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          target-folder: program
